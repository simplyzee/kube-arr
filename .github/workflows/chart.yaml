name: chart

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dispatcher-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: transcoder/go.mod
      - name: go vet and test
        working-directory: transcoder
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt"; exit 1; }
          go vet ./...
          go test -count=1 -v ./...

  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Fetch chart dependencies (kube-rclone)
        run: |
          helm repo add simplyzee https://charts.simplyzee.dev
          helm dependency update kube-arr

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: helm lint (every CI values file)
        run: |
          for f in kube-arr/ci/*.yaml; do
            echo "::group::helm lint -f $f"
            helm lint kube-arr --strict -f "$f"
            echo "::endgroup::"
          done

      - name: Render and validate against Kubernetes schemas
        run: |
          for f in kube-arr/ci/*.yaml; do
            echo "::group::$f"
            helm template media kube-arr -f "$f" > rendered.yaml
            cat rendered.yaml
            kubeconform -strict -summary -kubernetes-version 1.30.0 rendered.yaml
            echo "::endgroup::"
          done

      - name: Each values file renders the expected apps
        run: |
          count() { helm template media kube-arr -f "$1" | grep -c '^kind: Deployment'; }
          [ "$(count kube-arr/ci/defaults-values.yaml)" = 5 ]                 # sonarr radarr bazarr prowlarr jellyfin
          [ "$(count kube-arr/ci/everything-plex-ingress-values.yaml)" = 7 ]  # all six + plex
          [ "$(count kube-arr/ci/existing-claims-values.yaml)" = 3 ]          # sonarr bazarr prowlarr
          helm template media kube-arr -f kube-arr/ci/rclone-values.yaml | grep -q '^kind: DaemonSet'
          helm template media kube-arr -f kube-arr/ci/rclone-values.yaml | grep -q 'mountPropagation: HostToContainer'
          ! helm template media kube-arr | grep -q '^kind: DaemonSet'   # rclone off by default
          # Transcode dispatch: RBAC, swap hook and dispatcher only when enabled
          t=$(helm template media kube-arr -f kube-arr/ci/transcode-plex-values.yaml)
          echo "$t" | grep -q '^kind: Role$'
          echo "$t" | grep -q 'name: install-transcoder'
          echo "$t" | grep -q 'mountPath: /custom-cont-init.d'
          echo "$t" | grep -q '"serverUrl": "http://media-plex:32400"'
          ! helm template media kube-arr | grep -q 'install-transcoder'
          [ "$(helm template media kube-arr | grep -c 'automountServiceAccountToken: false')" -ge 5 ]
          helm template media kube-arr -f kube-arr/ci/everything-plex-ingress-values.yaml | grep -q 'host: "sonarr.home.example.com"'

      - name: Artifact Hub image list matches the chart
        run: |
          python3 .github/scripts/check-artifacthub-images.py kube-arr \
            kube-arr/ci/defaults-values.yaml \
            kube-arr/ci/everything-plex-ingress-values.yaml \
            kube-arr/ci/rclone-emby-values.yaml \
            kube-arr/ci/rclone-values.yaml \
            kube-arr/ci/transcode-plex-values.yaml

      - name: Bad values fail with clear messages
        run: |
          expect_fail() {
            if helm template media kube-arr "$@" > /dev/null 2> err.txt; then
              echo "expected failure for: $*"; exit 1
            fi
            cat err.txt
          }
          expect_fail --set mediaServer=kodi
          expect_fail --set media.existingClaim=a --set media.hostPath.path=/mnt/x
          grep -q "only one of" err.txt
          expect_fail --set media.nfs.server=nas
          grep -q "nfs.path is required" err.txt
          expect_fail --set ingress.enabled=true
          grep -q "has no hostname" err.txt
          expect_fail --set sonarr.enabled=false --set radarr.enabled=false --set bazarr.enabled=false \
                      --set prowlarr.enabled=false --set mediaServer=none
          grep -q "no apps are enabled" err.txt
          expect_fail --set rclone.enabled=true
          # kube-arr or kube-rclone may report it first; both explain the fix.
          grep -Eq "needs your rclone config|no rclone config found" err.txt
          expect_fail -f kube-arr/ci/rclone-values.yaml --set media.hostPath.path=/mnt/x
          grep -q "only one of" err.txt
          expect_fail --set transcode.enabled=true --set mediaServer=none
          grep -q "transcode.enabled needs a media server" err.txt

      - name: Package
        run: helm package kube-arr --destination dist

      - uses: actions/upload-artifact@v4
        with:
          name: kube-arr-chart
          path: dist/*.tgz

  smoke-test:
    # Installs the default stack in a throwaway kind cluster and checks every
    # app answers over HTTP and that they really share the media volume.
    needs: lint-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Fetch chart dependencies (kube-rclone)
        run: |
          helm repo add simplyzee https://charts.simplyzee.dev
          helm dependency update kube-arr

      - uses: helm/kind-action@v1

      - name: Install the default stack
        run: |
          helm install media kube-arr --wait --timeout 15m \
            --set media.persistence.size=1Gi \
            --set appDefaults.config.size=256Mi \
            --set jellyfin.config.size=256Mi
          kubectl get pods -o wide

      - name: Every app answers over HTTP
        run: |
          for svc in media-sonarr:8989 media-radarr:7878 media-bazarr:6767 media-prowlarr:9696 media-jellyfin:8096; do
            for i in $(seq 1 30); do
              code=$(kubectl run "probe-$RANDOM" --rm -i --restart=Never --quiet --image=curlimages/curl -- \
                curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://$svc/" || true)
              case "$code" in 2??|3??|401) echo "$svc -> $code"; break;; esac
              [ "$i" = 30 ] && { echo "$svc never answered (last: $code)"; exit 1; }
              sleep 5
            done
          done

      - name: Apps share the media volume
        run: |
          kubectl exec deploy/media-sonarr -- sh -c 'mkdir -p /data/media/tv && echo hello > /data/media/tv/check.txt'
          kubectl exec deploy/media-radarr -- cat /data/media/tv/check.txt | grep -q hello
          kubectl exec deploy/media-jellyfin -- cat /data/media/tv/check.txt | grep -q hello
          if kubectl exec deploy/media-jellyfin -- sh -c 'touch /data/should-fail' 2>/dev/null; then
            echo "media server should mount media read-only"; exit 1
          fi
          echo "shared volume OK, media server read-only OK"

      - name: Prowlarr doesn't mount media
        run: |
          ! kubectl exec deploy/media-prowlarr -- test -d /data/media

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods,pvc,svc -o wide
          kubectl describe pods
          for d in $(kubectl get deploy -o name); do echo "== $d"; kubectl logs "$d" --tail=50 || true; done

  rclone-smoke-test:
    # Installs the stack with kube-rclone in kind, using rclone's in-memory
    # backend, and checks files written by the apps go through the FUSE mount.
    needs: lint-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Fetch chart dependencies (kube-rclone)
        run: |
          helm repo add simplyzee https://charts.simplyzee.dev
          helm dependency update kube-arr

      - uses: helm/kind-action@v1

      - name: Install the stack on a kube-rclone mount
        run: |
          printf '[mem]\ntype = memory\n' > rclone.conf
          helm install media kube-arr --wait --timeout 15m \
            --set rclone.enabled=true \
            --set rclone.rclone.remote=mem:media \
            --set-file rclone.rclone.config=rclone.conf \
            --set mediaServer=none \
            --set bazarr.enabled=false \
            --set prowlarr.enabled=false \
            --set appDefaults.config.size=256Mi
          kubectl get pods -o wide

      - name: Apps write through the rclone mount
        run: |
          kubectl exec deploy/media-sonarr -- sh -c 'grep " /data " /proc/mounts'
          kubectl exec deploy/media-sonarr -- sh -c 'grep " /data " /proc/mounts | grep -q rclone'
          kubectl exec deploy/media-sonarr -- sh -c 'mkdir -p /data/media/tv && echo hello > /data/media/tv/check.txt'
          kubectl exec deploy/media-radarr -- cat /data/media/tv/check.txt | grep -q hello
          kubectl exec ds/media-rclone -c rclone -- cat /mnt/disks/rclone/media/tv/check.txt | grep -q hello
          echo "Sonarr wrote through rclone; Radarr and the rclone pod both see it"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods,ds,svc,secret -o wide
          kubectl describe pods
          kubectl logs ds/media-rclone -c rclone --tail=100 || true
          for d in $(kubectl get deploy -o name); do echo "== $d"; kubectl logs "$d" --tail=50 || true; done

  transcode-smoke-test:
    # Builds the dispatcher, installs each media server with transcode
    # dispatch in kind, and runs transcodes through it.
    needs: [dispatcher-tests, lint-and-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        server: [jellyfin, emby, plex]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Fetch chart dependencies (kube-rclone)
        run: |
          helm repo add simplyzee https://charts.simplyzee.dev
          helm dependency update kube-arr

      - name: Build the dispatcher image
        run: docker build -t ghcr.io/simplyzee/kube-arr-transcoder:ci transcoder

      - uses: helm/kind-action@v1

      - name: Install ${{ matrix.server }} with transcode dispatch
        run: |
          kind load docker-image ghcr.io/simplyzee/kube-arr-transcoder:ci --name chart-testing
          helm install media kube-arr --wait --timeout 15m \
            --set mediaServer=${{ matrix.server }} \
            --set sonarr.enabled=false --set radarr.enabled=false \
            --set bazarr.enabled=false --set prowlarr.enabled=false \
            --set transcode.enabled=true \
            --set transcode.dispatcher.image.tag=ci \
            --set transcode.dispatcher.image.pullPolicy=Never \
            --set transcode.resources.requests.cpu=100m \
            --set transcode.resources.requests.memory=128Mi \
            --set media.persistence.size=1Gi \
            --set ${{ matrix.server }}.config.size=1Gi
          kubectl get pods -o wide
          kubectl logs deploy/media-${{ matrix.server }} -c ${{ matrix.server }} | grep "kube-arr" || true

      - name: Transcodes run as pods
        run: .github/scripts/transcode-e2e.sh ${{ matrix.server }}

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl logs deploy/media-${{ matrix.server }} -c ${{ matrix.server }} --tail=200 || true
          kubectl logs deploy/media-${{ matrix.server }} -c install-transcoder || true

